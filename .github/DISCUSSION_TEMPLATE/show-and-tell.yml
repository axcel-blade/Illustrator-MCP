title: "[Show] "
labels: ["show-and-tell"]
body:
  - type: textarea
    id: built
    attributes:
      label: What I built
      description: A poster, logo, UI screen, brand kit... made with Illustrator MCP.
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Prompt or brief
      description: What you asked the AI (Claude, ChatGPT, ...) to do.
  - type: textarea
    id: images
    attributes:
      label: Screenshots / exports
      description: Drag in PNG/SVG exports or screenshots of the Illustrator document.
  - type: textarea
    id: tips
    attributes:
      label: Tips for others
      description: Tools, wording or settings that worked well.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Illustrator MCP, Illustrator and AI client versions.
      placeholder: "Illustrator MCP 1.0.0, Illustrator 2026 (30.x), Claude Desktop"
